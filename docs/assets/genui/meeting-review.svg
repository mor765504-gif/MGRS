<svg xmlns="http://www.w3.org/2000/svg" width="860" height="660" viewBox="0 0 860 660"><defs><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol></defs><foreignObject x="0" y="0" width="860" height="660"><div xmlns="http://www.w3.org/1999/xhtml" class="canvas"><style>*{box-sizing:border-box}button,input{font:inherit;color:inherit}button{cursor:default;border:0;background:none;padding:0;text-align:inherit}.ico{width:14px;height:14px}.canvas{width:860px;height:660px;padding:38px 47px;background:#F1F2F4;color:#1C1F25;--sheet:#fff;--mist:#F4F5F7;--mist-2:#E7E9ED;--line:rgba(24,28,38,.08);--hover:rgba(24,28,38,.045);--ink:#1C1F25;--ink-2:#5A606B;--ink-3:#979DA7;--ok:#2AA172;--busy:#E08A1E;--solid:#17191E;--on-solid:#fff;--solid-hover:#3B4049;--shadow-1:0 1px 1px rgba(28,32,44,.04),0 2px 6px rgba(28,32,44,.05);--hi:inset 0 1px 0 rgba(255,255,255,.95);--ease:cubic-bezier(.3,.7,.2,1);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.55}.eyebrow{font:700 12px/1.2 sans-serif;letter-spacing:.10em;color:#8E939D;margin-bottom:10px}.foot{font:12px/1.4 sans-serif;color:#959BA4;margin-top:12px}.gu{width:100%}
.gu{white-space:normal;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.gu:empty{display:none}
.gu-card{background:var(--sheet);border-radius:20px;box-shadow:var(--hi),0 0 0 1px var(--line),var(--shadow-1);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.gu-card>header b{display:block;font-size:16px;font-weight:600;line-height:1.4}
.gu-card>header span{font-size:13px;color:var(--ink-3)}
.gu-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.gu-stat{background:var(--mist);border-radius:14px;padding:10px 14px;min-width:0}
.gu-stat span{display:block;font-size:12px;color:var(--ink-3)}
.gu-stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.gu-stat small{display:block;font-size:12px;color:var(--ink-3)}
.gu-stat[data-tone="warn"] b{color:var(--busy)} .gu-stat[data-tone="ok"] b{color:var(--ok)}
.gu-text{margin:0;font-size:14px;line-height:1.65}
.gu-text.muted{color:var(--ink-2)}
.gu-if{display:contents}
.gu-slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;font-size:14px}
.gu-slider input{width:100%;margin:0;accent-color:var(--ink)}
.gu-slider output{font-weight:600;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.gu-choice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px}
.gu-seg{display:flex;flex-wrap:wrap;gap:6px}
.gu-seg button{min-height:36px;padding:0 14px;border-radius:999px;background:var(--mist);font-size:14px;transition:background .15s,color .15s}
.gu-seg button:hover{background:var(--mist-2)}
.gu-seg button[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);font-weight:600}
.gu-check{display:flex;flex-direction:column;gap:2px}
.gu-ch-h{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.gu-meter{flex:1;height:6px;border-radius:999px;background:var(--mist-2);overflow:hidden}
.gu-meter i{display:block;height:100%;width:var(--w);background:var(--ok);border-radius:inherit;transition:width .3s var(--ease)}
.gu-item{display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 8px;border-radius:12px;transition:background .15s}
.gu-item:hover{background:var(--hover)}
.gu-item .box{width:20px;height:20px;margin-top:2px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--ink-3);color:#fff;transition:background .15s,box-shadow .15s}
.gu-item .box .ico{width:14px;height:14px;opacity:0}
.gu-item[aria-checked="true"] .box{background:var(--ok);box-shadow:none}
.gu-item[aria-checked="true"] .box .ico{opacity:1}
.gu-item .tx{min-width:0;font-size:14px;line-height:1.5}
.gu-item .tx b{font-weight:500}
.gu-item[aria-checked="true"] .tx b{color:var(--ink-3);text-decoration:line-through}
.gu-item .tx small{display:block;font-size:12px;color:var(--ink-3)}
.gu-tw{overflow-x:auto;margin:0 -4px}
.gu-tw table{border-collapse:collapse;width:100%;font-size:13.5px}
.gu-tw th{color:var(--ink-3);font-weight:600;font-size:12px;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.gu-tw td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.gu-tw tr:last-child td{border-bottom:0}
.gu-tw tr.hl td{background:var(--mist)} .gu-tw tr.hl td:first-child{border-radius:10px 0 0 10px;font-weight:600} .gu-tw tr.hl td:last-child{border-radius:0 10px 10px 0}
.gu-bars{display:flex;flex-direction:column;gap:8px}
.gu-bar{display:grid;grid-template-columns:minmax(84px,32%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.gu-bar .tr{height:8px;border-radius:999px;background:var(--mist);overflow:hidden}
.gu-bar i{display:block;height:100%;width:var(--w);background:var(--ink-2);border-radius:inherit;transition:width .4s var(--ease)}
.gu-bar b{font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.gu-acts{display:flex;flex-wrap:wrap;gap:8px}
.gu-btn{min-height:40px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;background:var(--sheet);box-shadow:var(--hi),0 0 0 1px var(--line),var(--shadow-1);transition:transform .18s var(--ease),background .15s}
.gu-btn:active{transform:scale(.97)}
.gu-btn.primary{background:var(--solid);color:var(--on-solid);box-shadow:none}
.gu-btn.primary:hover{background:var(--solid-hover)}
.gu button:disabled,.gu input:disabled{opacity:.55;cursor:default}
.gu-pend{height:14px;width:min(60%,240px);border-radius:8px;background:linear-gradient(90deg,var(--mist),var(--mist-2),var(--mist));background-size:200% 100%;animation:guShim 1.1s linear infinite}
@keyframes guShim{to{background-position:-200% 0}}
.gu-app{display:block;width:100%;border:0;border-radius:18px;background:transparent;box-shadow:0 0 0 1px var(--line)}
.gu-app-wait,.gu-err{font-size:13px;color:var(--ink-3);padding:6px 2px}
.gu-src{margin-top:10px;white-space:normal;background:var(--sheet);border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.gu-tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line)}
.gu-tabs button{height:30px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--ink-2)}
.gu-tabs button[aria-selected="true"]{background:var(--mist);color:var(--ink);font-weight:600}
.gu-src pre{margin:0;padding:12px 14px;max-height:300px;overflow:auto;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.gu-pend{animation:none}.gu-meter i,.gu-bar i{transition:none}}
@media (max-width:760px){.gu-card{padding:12px 12px 14px}.gu-slider{grid-template-columns:minmax(0,1fr) auto}.gu-slider>span{grid-column:1/-1}}</style><div class="eyebrow">MIMI / GENUI · NATIVE RENDERER · EXAMPLE 1</div><div class="gu" data-gu="preview_0"><section data-render-stamp="9" class="gu-card" data-render-key="preview_0:k.0" data-k="k.0" data-tone="plain"><header><b>会议行动项 · 审阅草稿</b><span>示例纪要 v2 · 等待用户审阅</span></header><div data-render-stamp="3" class="gu-row" data-render-key="preview_0:k.0.0" data-k="k.0.0"><div data-render-stamp="1" class="gu-stat" data-render-key="preview_0:k.0.0.0" data-k="k.0.0.0" data-tone="ok"><span>已确认认领</span><b>2</b></div><div data-render-stamp="2" class="gu-stat" data-render-key="preview_0:k.0.0.1" data-k="k.0.0.1" data-tone="warn"><span>待确认</span><b>1</b></div></div><div data-render-stamp="4" class="gu-tw" data-render-key="preview_0:k.0.1" data-k="k.0.1"><table><thead><tr><th>行动项</th><th>会议依据</th><th>当前判断</th></tr></thead><tbody><tr class="hl" data-render-key="preview_0:k.0.1.0" data-k="k.0.1.0"><td>整理预算清单</td><td>发言 §03</td><td>已认领</td></tr><tr class="" data-render-key="preview_0:k.0.1.1" data-k="k.0.1.1"><td>联系供应商</td><td>发言 §06</td><td>待确认</td></tr><tr class="" data-render-key="preview_0:k.0.1.2" data-k="k.0.1.2"><td>提交纪要初稿</td><td>发言 §09</td><td>已认领</td></tr></tbody></table></div><p data-render-stamp="5" class="gu-text muted" data-render-key="preview_0:k.0.2" data-k="k.0.2">“这个我可以先了解一下”不足以证明正式认领。</p><div data-render-stamp="6" class="gu-choice" data-render-key="preview_0:k.0.3" data-k="k.0.3"><span>待确认事项的编辑草稿</span><div class="gu-seg" role="group" aria-label="待确认事项的编辑草稿"><button type="button" data-k="k.0.3:待确认" data-act="gu-pick" data-mid="preview_0" data-session-id="demo" data-message-id="native0" data-presentation-key="" data-stream-message-id="" data-content-generation="0" data-block-id="" data-state-revision="0" data-name="owner" data-v="待确认" aria-pressed="true">待确认</button><button type="button" data-k="k.0.3:拟指派" data-act="gu-pick" data-mid="preview_0" data-session-id="demo" data-message-id="native0" data-presentation-key="" data-stream-message-id="" data-content-generation="0" data-block-id="" data-state-revision="0" data-name="owner" data-v="拟指派" aria-pressed="false">拟指派</button></div></div><div data-render-stamp="8" class="gu-acts" data-render-key="preview_0:k.0.4" data-k="k.0.4"><button data-render-stamp="7" type="button" class="gu-btn" data-render-key="preview_0:k.0.4.0" data-k="k.0.4.0" data-act="gu-btn" data-mid="preview_0" data-session-id="demo" data-message-id="native0" data-presentation-key="" data-stream-message-id="" data-content-generation="0" data-block-id="" data-state-revision="0">复制审阅摘要</button></div></section></div><div class="foot">虚构数据 · 源自 mimi-ui/1 原生 guBuild / guHTML · 静态示意</div></div></foreignObject></svg>